    hirundo_model: "hirundo-io/Llama-3.2-3B-Instruct-improved-security"
  gemma_3:
    base_model: "google/gemma-3-1b-it"
    hirundo_model: "hirundo-io/Gemma-3-1B-it-Instruction-Following-Unlearned"
  gemma_4:
    base_model: "google/gemma-4-E4B-it"
